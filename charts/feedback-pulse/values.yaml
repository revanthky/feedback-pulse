replicaCount: 1

image:
  repository: ghcr.io/revanthky/feedback-pulse
  tag: "1.0.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8501

# Hostname for the HTTPRoute. "*" or empty means match any host.
hostname: "*"

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Injected by DKubeX when declared in `dependencies`.
postgres:
  db_url: ""
minio:
  endpoint: ""
  access_key: ""
  secret_key: ""
  bucket: ""

# LLM defaults. Optional — users can also configure these from the app's own Settings page,
# which takes precedence once saved.
llm:
  baseUrl: ""
  token: ""
  model: ""
